        <style>
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-content {
                min-height: 100%;
                background: radial-gradient(1200px 600px at 50% -10%, #1a2745 0%, #0f1729 55%) #0f1729;
                font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
                -webkit-font-smoothing: antialiased;
                display: flex; align-items: center; justify-content: center;
                padding: 20px; box-sizing: border-box;
            }
            .staticrypt-page { width: 100%; max-width: 400px; }
            .staticrypt-form {
                background: linear-gradient(160deg, #1a2540, #141d33);
                border: 1px solid #263352;
                border-radius: 20px;
                padding: 38px 34px 30px;
                text-align: center;
                box-shadow: 0 18px 50px rgba(0,0,0,.45);
            }
            .staticrypt-logo {
                width: 58px; height: 58px; border-radius: 16px; margin: 0 auto 16px;
                background: linear-gradient(135deg, #2563eb, #60a5fa);
                display: flex; align-items: center; justify-content: center;
                font-size: 27px; box-shadow: 0 6px 18px rgba(37,99,235,.35);
            }
            .staticrypt-brand { color: #7d8aa5; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; margin: 0 0 6px; }
            .staticrypt-title { color: #ffffff; font-size: 20px; font-weight: 700; margin: 0 0 10px; line-height: 1.4; }
            .staticrypt-instructions-text {
                display: inline-block; background: #1e2d4a; color: #7da9e0;
                font-size: 12.5px; padding: 5px 14px; border-radius: 20px; margin: 0 0 22px;
            }
            .staticrypt-password-container {
                position: relative; width: 100%; box-sizing: border-box; margin: 0 0 14px;
                background: #0f1729; border: 1px solid #2b3a5e; border-radius: 12px;
                transition: border-color .15s;
            }
            .staticrypt-password-container:focus-within { border-color: #60a5fa; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                background: transparent; border: 0; outline: 0; color: #e8edf5;
                box-sizing: border-box; font-size: 15px; font-family: inherit;
                padding: 14px 44px 14px 16px; width: 100%;
            }
            .staticrypt-form input::placeholder { color: #5b6a8a; }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 18px; width: 18px; padding: 13px;
                position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
                opacity: 45%; filter: invert(75%) sepia(12%) saturate(500%) hue-rotate(180deg);
            }
            label.staticrypt-remember {
                display: flex; align-items: center; justify-content: center;
                color: #8294b5; font-size: 13px; margin-bottom: 18px; cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] { transform: scale(1.25); margin-right: 9px; accent-color: #3b82f6; }
            .staticrypt-form .staticrypt-decrypt-button {
                outline: 0; border: 0; width: 100%; cursor: pointer;
                background: linear-gradient(135deg, #2563eb, #3b82f6);
                border-radius: 12px; padding: 14px; color: #fff;
                font-size: 15px; font-weight: 700; font-family: inherit;
                box-shadow: 0 6px 16px rgba(37,99,235,.3);
                transition: filter .15s, transform .1s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(112%); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(1px); }
            .staticrypt-foot { color: #4d5a78; font-size: 11.5px; margin-top: 20px; line-height: 1.6; }
            .staticrypt-error {
                display: none; background: #2b1214; border: 1px solid #5c1d1d; color: #fca5a5;
                border-radius: 10px; padding: 9px 14px; font-size: 12.5px; margin: 0 0 14px;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f1729; }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem;
                border: 0.25em solid #2b3a5e; border-right-color: #60a5fa; border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
