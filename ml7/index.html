            .staticrypt-password-container {

                padding: 14px 44px 14px 16px; width: 100%;
            }
            .staticrypt-form input::placeholder { color: #9aa5b5; }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 18px; width: 18px; padding: 13px;
                position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
                opacity: .45;

                color: #6b7688; font-size: 13px; margin-bottom: 18px; cursor: pointer;
